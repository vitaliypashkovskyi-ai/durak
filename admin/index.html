<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Статистика Ігри UA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* the owner's dashboard: opened from /stats in the bot, data only for admins of @UAIgry */
:root{
  color-scheme:light;
  --page:#f3f2ee; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#8a8984;
  --grid:#e4e2dc; --series-1:#2a78d6; --series-2:#eb6834; --hover:rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#111110; --surface-1:#1a1a19; --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#8f8e86;
    --grid:#2c2c2a; --series-1:#3987e5; --series-2:#d95926; --hover:rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#111110; --surface-1:#1a1a19; --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#8f8e86;
  --grid:#2c2c2a; --series-1:#3987e5; --series-2:#d95926; --hover:rgba(255,255,255,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-primary);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--text-secondary);font-size:13px;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface-1);border-radius:14px;padding:12px 14px}
.tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--text-secondary);font-size:13px}
.card{background:var(--surface-1);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 2px}
.card .note{color:var(--text-secondary);font-size:12px;margin:0 0 8px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bar{fill:var(--series-1)}
.chart .bar.alt{fill:var(--series-2)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--hover)}
.tip{position:absolute;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12px;padding:4px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.hbar{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.hbar .track{height:12px;border-radius:0 4px 4px 0;background:transparent}
.hbar .fill{height:12px;border-radius:0 4px 4px 0;background:var(--series-1)}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--text-secondary);font-weight:600;font-size:12px}
.err{background:var(--surface-1);border-radius:14px;padding:20px;text-align:center;color:var(--text-secondary)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--text-secondary);font-size:12px}
@media (max-width:520px){.hbar{grid-template-columns:110px 1fr 40px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">Завантаження…</div></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light'; } catch (e) {} }
const SERVER = new URLSearchParams(location.search).get('server') || 'https://durak.durak-server.workers.dev';
const GAMES = { durak: '🃏 Дурень', rpoker: '🎯 Розписний покер', svara: '🎴 Свара', thousand: '🂡 Тисяча', goat: '🐐 Козел', pref: '🎩 Преферанс',
  mafia: '🎭 Мафія', spy: '🕵️ Шпигун', quiz: '❓ Вікторина', battle: '🚢 Морський бій', checkers: '⚪ Шашки', chess: '♟ Шахи',
  nardy: '🎲 Довгі нарди', bgammon: '🎲 Короткі нарди', dice: '⚀ Кості', klondike: '🂠 Косинка' };
const SOURCES = { direct: '🔗 Напряму', friend: '👥 Від друзів', channel: '📢 Канал', group: '💬 Чат', site: '🌐 Сайт', seo: '🔎 Google', old: '⏳ До міток' };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const sum = a => a.reduce((x, y) => x + y, 0);

// 30 daily bars with a hover tooltip; one series per chart (no legend needed — the title names it)
function barChart(days, values, unit, alt) {
  const W = 600, H = 170, L = 28, B = 22, T = 8, n = values.length;
  const max = Math.max(1, ...values), step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = (W - L) / n, y = v => T + (H - T - B) * (1 - v / top);
  const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  for (let v = 0; v <= top; v += step) {
    mk('line', { x1: L, x2: W, y1: y(v), y2: y(v), class: 'gl' });
    mk('text', { x: L - 4, y: y(v) + 3, 'text-anchor': 'end', class: 'ax' }).textContent = v;
  }
  const box = el('div', 'chart'), tip = el('div', 'tip');
  values.forEach((v, i) => {
    const x = L + i * bw, w = Math.max(1, bw - 2), h = H - B - y(v);
    if (v > 0) {
      const r = Math.min(4, w / 2, h);
      // rounded data end (top), square at the baseline
      mk('path', { class: 'bar' + (alt ? ' alt' : ''), d: `M${x + 1},${H - B} V${y(v) + r} Q${x + 1},${y(v)} ${x + 1 + r},${y(v)} H${x + 1 + w - r} Q${x + 1 + w},${y(v)} ${x + 1 + w},${y(v) + r} V${H - B} Z` });
    }
    if (i % 5 === 4 || i === n - 1) mk('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle', class: 'ax' }).textContent = days[i];
    const hit = mk('rect', { x, y: T, width: bw, height: H - B - T, class: 'hit' });
    hit.addEventListener('mouseenter', () => { tip.textContent = `${days[i]}: ${v} ${unit}`; tip.style.display = 'block'; tip.style.left = ((x + bw / 2) / W * 100) + '%'; tip.style.top = (y(v) / H * 100) + '%'; });
    hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    hit.addEventListener('click', () => hit.dispatchEvent(new Event('mouseenter')));
  });
  box.append(svg, tip);
  // the same numbers as a table (accessibility, exact values)
  const d = el('details'); d.appendChild(el('summary', '', 'Таблиця'));
  const t = el('table'); t.innerHTML = '<tr><th>День</th><th>Значення</th></tr>';
  days.forEach((dd, i) => { const tr = el('tr'); tr.append(el('td', '', dd), el('td', '', String(values[i]))); t.appendChild(tr); });
  d.appendChild(t); box.appendChild(d);
  return box;
}
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p); }
function card(title, note, child) { const c = el('div', 'card'); c.appendChild(el('h2', '', title)); if (note) c.appendChild(el('p', 'note', note)); c.appendChild(child); return c; }
function tile(v, l) { const t = el('div', 'tile'); t.append(el('div', 'v', String(v)), el('div', 'l', l)); return t; }

async function load() {
  const app = document.getElementById('app');
  const init = tg && tg.initData;
  if (!init) { app.innerHTML = '<div class="err">Відкрийте панель із бота: напишіть /stats у @IgryUA_bot.</div>'; return; }
  let d;
  try {
    const r = await fetch(SERVER + '/api/dash', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ init }) });
    if (r.status === 403) { app.innerHTML = '<div class="err">Панель лише для адміністраторів каналу @UAIgry.</div>'; return; }
    d = await r.json();
  } catch (e) { app.innerHTML = '<div class="err">Не вдалося завантажити. Перевірте інтернет.</div>'; return; }
  app.innerHTML = '';
  app.append(el('h1', '', '📊 Статистика «Ігри UA»'), el('p', 'sub', `Останні 30 днів · ${d.days[0]}–${d.days[d.days.length - 1]}`));
  const tiles = el('div', 'tiles');
  tiles.append(tile(d.totals.players, 'гравців усього'), tile(sum(d.newPlayers), 'нових за 30 днів'), tile(d.totals.online, 'зараз онлайн'),
    tile(sum(d.onlineGames) + sum(d.botGames), 'ігор за 30 днів'), tile(d.totals.stars + ' ⭐', 'зароблено зірок'), tile(d.totals.notify, 'отримують нагадування'));
  app.appendChild(tiles);
  app.appendChild(card('Нові гравці', 'Хто вперше відкрив гру в Telegram', barChart(d.days, d.newPlayers, 'нових')));
  app.appendChild(card('Активні гравці', 'Скільки людей відкривали гру за день', barChart(d.days, d.active, 'гравців')));
  app.appendChild(card('Онлайн-ігри з людьми', 'Партії, де грали щонайменше двоє людей', barChart(d.days, d.onlineGames, 'партій')));
  app.appendChild(card('Ігри з ботами', 'Завершені партії з ботами', barChart(d.days, d.botGames, 'партій')));
  if (sum(d.stars)) app.appendChild(card('Зірки ⭐', 'Покупки за день', barChart(d.days, d.stars, '⭐', true)));
  // games: horizontal bars sorted by count, labelled directly
  const gbox = el('div'); const gmax = Math.max(1, ...d.games.map(g => g[1]));
  d.games.forEach(([g, n]) => { const r = el('div', 'hbar'); const tr = el('div', 'track'); const f = el('div', 'fill'); f.style.width = (100 * n / gmax) + '%'; tr.appendChild(f); r.append(el('div', '', GAMES[g] || g), tr, el('div', 'n', String(n))); gbox.appendChild(r); });
  if (!d.games.length) gbox.appendChild(el('p', 'note', 'Ще немає зіграних партій.'));
  app.appendChild(card('Популярність ігор', 'Партії за 30 днів (з людьми й ботами)', gbox));
  // sources: a table — exact numbers matter here
  const t = el('table'); t.innerHTML = '<tr><th>Звідки</th><th>Усього</th><th>За тиждень</th><th>Повернулися</th></tr>';
  d.sources.forEach(s => { const tr = el('tr'); tr.append(el('td', '', SOURCES[s.source] || '🏷 ' + s.source), el('td', '', String(s.total)), el('td', '', String(s.week || 0)), el('td', '', s.total ? Math.round(100 * (s.returned || 0) / s.total) + '%' : '—')); t.appendChild(tr); });
  app.appendChild(card('Звідки приходять гравці', '«Повернулися» — заходили знову хоча б через добу після першого разу', t));
}
load();
</script>
</body>
</html>
