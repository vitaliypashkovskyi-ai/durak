<meta name="description" content="Дурень, Розписний покер, Свара, Тисяча, Козел, Мафія, Шпигун, Морський бій, Шашки, Нарди й Кості з друзями або ботами прямо в Telegram — @IgryUA_bot.">
<link rel="canonical" href="https://www.igryua.biz.ua/igry/">
<meta property="og:title" content="Ігри UA — Дурень, Покер, Тисяча, Мафія у Telegram">
<meta property="og:description" content="Карткові й компанійські ігри з друзями прямо в Telegram.">
<meta property="og:image" content="https://www.igryua.biz.ua/promo/promo-wide.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// Opened in a normal browser (not inside Telegram) → send the visitor to the bot, keeping a room code.
// Stays on the page: inside Telegram, on localhost (tests), with ?server= or ?web=1 (kept for the tab).
(function () {
  try {
    var W = window.Telegram && window.Telegram.WebApp;
    var inTg = !!(W && (W.initData || (W.platform && W.platform !== 'unknown'))) || /tgWebApp/.test(location.hash);
    var q = new URLSearchParams(location.search);
    if (q.get('web') === '1') sessionStorage.setItem('games.web', '1');
    var stay = inTg || sessionStorage.getItem('games.web') === '1' || q.has('server') ||
      /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || /bot|crawl|spider|lighthouse/i.test(navigator.userAgent);
    if (stay) return;
    // startapp (even empty) opens the game itself, not the bot chat with «START BOT».
    var room = (q.get('room') || '').replace(/[^A-Za-z0-9_]/g, '');
    var tgApp = 'tg://resolve?domain=IgryUA_bot&startapp=' + room;
    var tgWeb = 'https://t.me/IgryUA_bot?startapp=' + room;
    document.addEventListener('DOMContentLoaded', function () {
      // after the page is built: an installed Telegram app opens the game right away
      // (navigating to tg:// earlier stops some browsers from finishing this page)
      setTimeout(function () { location.href = tgApp; }, 400);
      var d = document.createElement('div');
      d.id = 'tgGate';
      d.innerHTML =
        '<div class="gbox"><div class="glogo">🎲</div><h2>Ігри UA</h2>' +
        '<p>Ігри працюють у Telegram — з вашим рейтингом, бонусами й друзями.</p>' +
        '<ul class="gbonus">' +
        '<li>🎁 <b>+10 очок</b> за перший вхід</li>' +
        '<li>📅 <b>Бонус дня</b> — до +7 щодня поспіль</li>' +
        '<li>👥 <b>+15</b> за кожного друга, а другові <b>+5</b></li>' +
        '<li>🏆 Рейтинг, рівні й досягнення</li>' +
        '<li>🎨 Нові сорочки карт і столи за рівні</li>' +
        '</ul>' +
        '<a class="gbtn" href="' + tgApp + '">📱 Відкрити в Telegram</a>' +
        '<a class="gbtn alt" href="' + tgWeb + '" target="_blank" rel="noopener">🌐 Немає Telegram на цьому пристрої</a>' +
        '<a class="glink" href="?web=1' + (room ? '&room=' + room : '') + '">Грати тут, у браузері (як гість)</a></div>';
      document.body.appendChild(d);
    });
  } catch (e) {}
})();
</script>
<script>
// Telegram may keep an old copy of this page. Compare with version.json (never cached) and reload
// with a new address if the site has a newer release. PAGE_VERSION = the same number as ?v= below.
(function () {
  var PAGE_VERSION = 36;
  try {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !(j.v > PAGE_VERSION)) return;
        var u = new URL(location.href);
        if (u.searchParams.get('_v') === String(j.v)) return;   // already tried this version
        u.searchParams.set('_v', j.v);
        location.replace(u.toString());
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
<style>
:root{
  --felt:#21603e; --felt2:#143a27; --ink:#fff; --muted:rgba(255,255,255,.72);
  --card:#fffdf7; --red:#c62828; --black:#1b1b1b; --gold:#f5c542; --blue:#2f6fd6;
  --cw:min(64px,15.5vw);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--felt2);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt2) 80%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 span{color:var(--gold)}
.stat{font-size:13px;color:var(--muted);white-space:nowrap}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:7px 9px;font-size:15px;cursor:pointer;flex:none}
header{gap:6px}
@media (max-width:400px){ header h1{font-size:16px} .stat{font-size:11px} }

/* hub */
#hub{flex:1;overflow:auto;padding:8px 14px 20px}
.hubtop{display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto 6px}
.hubact{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);cursor:pointer}
.hubact.main{background:var(--blue)}
.hubrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.codein{width:100%;font:700 28px ui-monospace,Consolas,monospace;letter-spacing:6px;text-align:center;text-transform:uppercase;padding:10px;border:2px solid #ddd;border-radius:12px;margin-top:8px;user-select:text;-webkit-user-select:text}
.hubhead{font-size:14px;color:var(--muted);margin:4px 0 12px;text-align:center}
.hubgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:520px;margin:0 auto}
.gcard{background:rgba(255,255,255,.1);border:0;border-radius:16px;padding:18px 10px;color:#fff;text-align:center;cursor:pointer;font:inherit}
.gcard .ic{font-size:40px;display:block;line-height:1.1}
.gcard b{display:block;font-size:16px;margin-top:6px}
.gcard small{color:var(--muted);font-size:12px}
.gcard.soon{opacity:.45;cursor:default}

/* game area */
#game{flex:1;display:flex;flex-direction:column;min-height:0}

/* durak */
.opps{display:flex;justify-content:center;gap:6px;padding:6px 10px 0}
.opp{flex:1 1 0;max-width:150px;min-width:0;background:rgba(0,0,0,.2);border-radius:10px;padding:5px 4px 6px;text-align:center;font-size:12px;border:2px solid transparent}
.opp.att{border-color:var(--gold)}
.opp.def{border-color:#ff8a80}
.opp.done{opacity:.5}
.opp .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.opp .cn{margin-top:4px;display:flex;justify-content:center;align-items:center;gap:2px;font-weight:600}
.opp .cn span{margin-left:4px}
.opp .bd{font-size:11px;color:var(--muted);min-height:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opps.many{flex-wrap:wrap;gap:4px}
.opps.many .opp{flex:1 1 64px;max-width:90px;padding:3px 2px 4px;font-size:11px}
.opps.many .opp .cn{margin-top:2px}
.opps.many .opp .bd{font-size:10px;min-height:12px;margin-top:1px}
.card.tiny{--cw:14px;border-radius:3px;box-shadow:inset 0 0 0 1px #fffdf7,inset 0 0 0 2px #b3201f}
.cn .card.tiny + .card.tiny{margin-left:-8px}
.dmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;padding:0 12px}
#info{display:flex;align-items:center;gap:14px;align-self:stretch;justify-content:center}
#deck{--cw:calc(min(64px,15.5vw)*.8);position:relative;width:calc(var(--cw)*1.7);height:calc(var(--cw)*1.42)}
#deck .card{position:absolute;left:0;top:0}
#deck .trump{left:calc(var(--cw)*.42);top:calc(var(--cw)*.12);transform:rotate(90deg)}
#deck .empty{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.7);opacity:.35}
#infoText{font-size:13px;color:var(--muted);line-height:1.5}
#infoText b{color:#fff}
.tag{display:inline-block;background:rgba(255,255,255,.15);border-radius:6px;padding:0 6px;font-size:11px}
#table{display:grid;grid-template-columns:repeat(3,calc(var(--cw)*1.4));gap:10px 8px;justify-content:center;align-content:center;min-height:calc(var(--cw)*1.42*1.25*2 + 10px)}
.slot{position:relative;height:calc(var(--cw)*1.42*1.25)}
.slot .card{position:absolute;left:0;top:0}
.slot .card.d{left:calc(var(--cw)*.36);top:calc(var(--cw)*.3)}
.slot .card.target{box-shadow:0 0 0 3px var(--gold),0 2px 6px rgba(0,0,0,.35)}
.slot .card.tap{cursor:pointer}
#status{text-align:center;font-size:14px;min-height:20px;padding:2px 12px;color:#fff}
#btnRow{display:flex;justify-content:center;min-height:44px;padding:4px}
#act{border:0;border-radius:12px;padding:10px 28px;font-size:16px;font-weight:600;color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#act.take{background:#c0392b}
#hand{display:flex;justify-content:center;padding:14px 12px 18px;min-height:calc(var(--cw)*1.42 + 32px)}
.card{width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.12);background:var(--card);color:var(--black);position:relative;box-shadow:0 2px 6px rgba(0,0,0,.35);flex:none;transition:transform .15s,filter .15s,margin .15s}
.card.red{color:var(--red)}
.card .c{position:absolute;left:7%;top:4%;font-weight:700;line-height:.95;font-size:calc(var(--cw)*.27);text-align:center}
.card .c i{display:block;font-style:normal;font-size:calc(var(--cw)*.25)}
.card .m{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.55);padding-top:22%;padding-left:18%}
.card.tr::after{content:"";position:absolute;right:6%;top:6%;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.back{background:
  repeating-linear-gradient(45deg,transparent 0 6px,#b3201f 6px 8px),
  repeating-linear-gradient(-45deg,transparent 0 6px,#1b1b1b 6px 8px),#fffdf7;
  box-shadow:inset 0 0 0 3px #fffdf7,inset 0 0 0 5px #b3201f,0 2px 6px rgba(0,0,0,.35)}
.card.tiny.back{background:repeating-linear-gradient(45deg,transparent 0 3px,#b3201f 3px 4px),#fffdf7}
/* card backs unlocked by level */
body[data-back="petr"] .back{background:
  radial-gradient(circle at 30% 28%,#e8541e 0 14%,transparent 15%),
  radial-gradient(circle at 70% 72%,#f2a922 0 13%,transparent 14%),
  radial-gradient(circle at 72% 26%,#2e7d32 0 8%,transparent 9%),
  radial-gradient(circle at 28% 74%,#2e7d32 0 8%,transparent 9%),#fff6e0;
  background-size:100% 50%;box-shadow:inset 0 0 0 3px #fff6e0,inset 0 0 0 5px #e8541e,0 2px 6px rgba(0,0,0,.35)}
body[data-back="petr"] .card.tiny.back{background:radial-gradient(circle,#e8541e 0 30%,transparent 32%),#fff6e0;background-size:7px 7px}
body[data-back="gold"] .back{background:
  repeating-linear-gradient(45deg,#b8860b 0 3px,#f5d76e 3px 7px),#f5d76e;
  box-shadow:inset 0 0 0 3px #fff4c7,inset 0 0 0 5px #8a6508,0 2px 6px rgba(0,0,0,.35)}
body[data-back="gold"] .card.tiny.back{background:repeating-linear-gradient(45deg,#b8860b 0 2px,#f5d76e 2px 4px)}
/* tables */
body[data-table="blue"]{--felt:#1f4f8a;--felt2:#11294a}
body[data-table="wine"]{--felt:#7a2232;--felt2:#3a0e17}
body[data-table="night"]{--felt:#2b2b30;--felt2:#0c0c0f;--gold:#f0c75e}
body[data-table="night"] #app{background:radial-gradient(ellipse at 50% 45%,#2f2c22 0%,#0c0c0f 80%)}
/* look panel */
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 2px}
.look{border:2px solid transparent;border-radius:12px;background:#f1ede2;padding:8px 6px;text-align:center;font:inherit;color:#1b1b1b;cursor:pointer}
.look.on{border-color:var(--blue)}
.look.locked{opacity:.5;cursor:default}
.look .sw{display:block;margin:0 auto 4px;width:46px;height:34px;border-radius:8px}
.look .sw.card{width:30px;height:42px;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.look small{display:block;font-size:11px;color:#666}
#hand .card{cursor:pointer}
#hand .card.ok{transform:translateY(-10px)}
#hand .card.dim{filter:brightness(.62)}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* sea battle */
.btabs{display:flex;gap:6px;justify-content:center;padding:6px 10px 0;flex-wrap:wrap}
.btab{border:2px solid transparent;background:rgba(0,0,0,.22);color:#fff;border-radius:10px;padding:5px 9px;font-size:13px;cursor:pointer}
.btab.on{border-color:#fff}
.btab.turn{box-shadow:0 0 0 2px var(--gold)}
.btab.dead{opacity:.45}
.bmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;padding:6px 12px 14px}
.blabel{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:rgba(0,0,0,.28);padding:3px;border-radius:8px}
.grid.big{width:min(92vw,360px,48vh)}
.grid.small{width:min(48vw,190px,24vh)}
.cell{aspect-ratio:1;background:#2b78b8;border-radius:2px;display:grid;place-items:center;font-size:9px;color:#fff;line-height:1}
.grid.big .cell{font-size:15px}
.cell.ship{background:#a7b2bb}
.cell.miss{background:#1d5684}
.cell.miss::after{content:"•";color:#cfe3f5}
.cell.hit{background:#e0533d}
.cell.hit::after{content:"✕"}
.cell.sunk{background:#6b1d14}
.cell.sunk::after{content:"✕";color:#ffb4a8}
.grid.aim .cell.free{cursor:pointer}
.grid.aim{box-shadow:0 0 0 2px var(--gold)}
.brow{display:flex;gap:10px;justify-content:center;min-height:8px}
.brow button{border:0;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;color:#fff;background:var(--blue);cursor:pointer}
.brow button.sec{background:rgba(255,255,255,.18)}

/* mafia */
#game.g-mafia{transition:background .6s}
#game.nightmode{background:rgba(5,10,30,.55)}
.mbar{display:flex;justify-content:space-between;align-items:center;padding:6px 14px 2px;font-weight:700;font-size:16px}
#mTimer{font-variant-numeric:tabular-nums;color:var(--gold)}
.mrole{margin:4px 12px;padding:8px 12px;background:rgba(0,0,0,.25);border-radius:12px;font-size:14px}
.mextra{font-size:12px;color:var(--muted);margin-top:3px}
.mplayers{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;padding:6px 12px}
.mp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.1);color:#fff;font:inherit;min-width:0}
.mp .av{font-size:22px;line-height:1.1}
.mp .pn{font-size:12px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .ps{font-size:11px;color:var(--muted);min-height:13px}
.mp.can{cursor:pointer;background:rgba(255,255,255,.18)}
.mp.sel{border-color:var(--gold)}
.mp.me{background:rgba(47,111,214,.35)}
.mp.mate{border-color:#ff8a80}
.mp.dead{opacity:.45}
.mp:disabled{cursor:default}
#mBtns button{padding:8px 14px;font-size:14px}
.mchat{flex:1;min-height:70px;overflow:auto;margin:4px 12px;padding:6px 10px;background:rgba(0,0,0,.25);border-radius:12px;font-size:13px;line-height:1.4;user-select:text;-webkit-user-select:text}
.msg{margin:2px 0;word-wrap:break-word}
.msg.sys{color:#cfe8d6;font-style:italic}
.msg.mafia{color:#ffb4a8}
.msay{display:flex;gap:6px;padding:4px 12px 12px}
.msay input{flex:1;min-width:0;border:0;border-radius:12px;padding:10px 12px;font-size:15px;user-select:text;-webkit-user-select:text}
.msay input:disabled{opacity:.5}
.msay button{border:0;border-radius:12px;padding:0 16px;font-size:18px;background:var(--blue);color:#fff;cursor:pointer}

/* spy */
.locs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:50vh;overflow:auto;margin-top:6px}
.locs .loc{background:#eee8da;border-radius:8px;padding:4px 8px;font-size:13px}
.locs .loc.cur{background:var(--gold);font-weight:700}
.locs.pick .chip{font-size:13px;padding:6px 9px}

/* goat */
.opp.partner{background:rgba(47,111,214,.3)}
.gsc{font-size:16px;font-weight:700;color:#fff;text-align:center}
#gScore{flex-direction:column;align-items:center;gap:2px}
.tslot.ours .tl{color:#9fc3ff}

/* poker */
#pInfo{flex-direction:column;align-items:center;gap:2px}
.card.joker{background:linear-gradient(135deg,#fffdf7 0%,#ffe9a8 100%);color:#7b1fa2}
.card.joker .c{font-size:calc(var(--cw)*.22)}
#pBtns{flex-wrap:wrap;gap:6px}
#pBtns button{padding:8px 0;min-width:40px;font-size:16px}
#pBtns button:disabled{opacity:.35}

.tourbox{background:#fff3cf;border:1px solid #e9c25a;border-radius:12px;padding:10px 12px;margin:8px 0;text-align:left;font-size:14px;line-height:1.45}
.tourbox .tl1{font-weight:700}
.tourbox .tme{font-weight:700;color:#9a6a00}
.tourbox .sub{color:#666;font-size:13px}

.chip.notify{display:block;width:100%;margin:6px 0 2px;font-size:14px}
#online{font-weight:600;color:#9be37f}

/* checkers */
.ckhead{text-align:center;color:#fff;font-size:14px;padding:4px 10px;border-radius:10px;opacity:.85;margin:2px auto}
.ckhead.on{background:rgba(245,197,66,.28);opacity:1;font-weight:700}
.ckboard{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,420px,52vh);aspect-ratio:1;margin:6px auto;border:4px solid #5a3a1e;border-radius:6px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ck{background:#f0d9b5;display:grid;place-items:center}
.ck.dk{background:#a9784f;cursor:pointer}
.ck.lm{box-shadow:inset 0 0 0 3px rgba(255,235,59,.65)}
.ck.sel{background:#7a9a3a}
.ck.dest::after{content:"";width:32%;height:32%;border-radius:50%;background:rgba(124,214,90,.9)}
.pc{width:78%;height:78%;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.4);display:grid;place-items:center}
.pc.w{background:radial-gradient(circle at 35% 30%,#fff,#d9d9d9)}
.pc.b{background:radial-gradient(circle at 35% 30%,#555,#111)}
.pc.k::after{content:"♛";font-size:min(5vw,24px);color:#c9a000}
.pc.mv{box-shadow:0 0 0 3px #7cd65a,inset 0 -3px 0 rgba(0,0,0,.25)}
.pc.gone{opacity:.35}

/* nardy */
.ndboard{width:min(96vw,460px);margin:4px auto;background:#6b4423;border:4px solid #3e2612;border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ndrow{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;height:min(36vw,170px,22vh)}
.ndp{background:#d9b98a;border-radius:3px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;cursor:pointer;padding:2px 0;overflow:hidden}
.ndp.alt{background:#c49a63}
.ndp:not(.top){justify-content:flex-end}
.ndp.home{box-shadow:inset 0 0 0 2px rgba(255,215,0,.5)}
.ndp.sel{background:#9ccc65}
.ndp.dest{background:#aee571}
.ndp.lm{outline:2px solid #ffeb3b;outline-offset:-2px}
.ndp.src .ndc.mine{box-shadow:0 0 0 2px #4caf50}
.ndstack{display:flex;flex-direction:column;gap:1px;align-items:center;width:100%}
.ndp:not(.top) .ndstack{flex-direction:column-reverse}
.ndc{width:88%;aspect-ratio:1;border-radius:50%;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.ndc.mine{background:radial-gradient(circle at 35% 30%,#fff,#d6d6d6);color:#222}
.ndc.opp{background:radial-gradient(circle at 35% 30%,#555,#111);color:#fff}
.ndoff{text-align:center;color:#fff;font-size:13px;padding:6px;border-radius:6px;background:rgba(0,0,0,.25)}
.ndoff.dest{background:#4caf50;font-weight:700;cursor:pointer}
.nddice{display:flex;gap:8px;justify-content:center;align-items:center;margin:2px 0}
.ndd{font-size:42px;line-height:1;color:#fff}
.ndd.used{opacity:.28}
.ndwho{color:#fff;font-size:13px;opacity:.8}

/* dice */
.dcscore{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.dcp{background:rgba(0,0,0,.22);color:#fff;border-radius:10px;padding:3px 8px;font-size:13px}
.dcp.on{background:var(--gold);color:#222;font-weight:700}
.dcscore .tinfo{width:100%;text-align:center}
.dcdice{display:flex;gap:8px;justify-content:center;margin:10px 0 6px}
.dcd{font-size:56px;line-height:1;color:#fff;border-radius:10px;padding:0 2px;transition:transform .15s;user-select:none}
.dcd.tap{cursor:pointer}
.dcd.held{color:var(--gold);transform:translateY(-8px);text-shadow:0 0 10px rgba(245,197,66,.8)}
.dcd.empty{opacity:.3}
.dcsheet{overflow:auto;margin-top:6px}
.dct{width:100%;max-width:420px;margin:0 auto;border-collapse:collapse;font-size:14px;color:#fff}
.dct th,.dct td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
.dct td:first-child,.dct th:first-child{text-align:left}
.dct tr.can,.dct tr.zero{cursor:pointer}
.dct tr.can{background:rgba(124,214,90,.18)}
.dct td.pick{font-weight:700;color:#aef08f}
.dct tr.zero td.pick{color:#ffb4a8}
.dct tr.sep td{border-top:2px solid rgba(255,255,255,.3)}
.dct tr.bonus td{font-size:12px;opacity:.8}
.dct tr.total td{font-weight:800;color:var(--gold)}

/* svara */
#sInfo{flex-direction:column;align-items:center;gap:2px}
#sBtns{flex-wrap:wrap;gap:6px}
#sBtns button{padding:8px 12px;font-size:16px}
#sBtns button.up{background:#b8860b}
#sBtns button:disabled{opacity:.35}
.spot{font-size:30px;font-weight:800;color:var(--gold);text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.sres{font-size:17px;font-weight:700;color:#fff;text-align:center;padding:10px 14px;background:rgba(0,0,0,.25);border-radius:12px}
.opp.sfold{opacity:.5}
.opp.swin{box-shadow:0 0 0 2px var(--gold)}
.opp .cn .scard{display:inline-block;background:#fffdf7;color:#111;border-radius:5px;padding:1px 4px;margin:0 1px;font-weight:700;font-size:13px}
.opp .cn .scard.red{color:#c62828}
.opp .cn .scard.jk{background:var(--gold)}

/* thousand */
.tscore{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:4px 10px 0}
.tsc.me{color:#fff;font-weight:600}
.tmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;padding:0 12px}
.tinfo{font-size:14px;text-align:center}
.tinfo.small{font-size:12px;color:var(--muted)}
.redsuit{color:#ff8a80}
.trow{display:flex;gap:10px;justify-content:center;align-items:flex-end;min-height:calc(var(--cw)*1.42 + 18px)}
.tslot{display:flex;flex-direction:column;align-items:center;gap:3px}
.tl{font-size:11px;color:var(--muted);max-width:calc(var(--cw)*1.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tempty{color:var(--muted);font-size:13px;align-self:center}
.tres{border-collapse:collapse;font-size:14px;background:rgba(0,0,0,.2);border-radius:10px;overflow:hidden}
.tres th,.tres td{padding:6px 10px;text-align:center}
.tres td:first-child{text-align:left}
.tres th{font-size:12px;color:var(--muted);font-weight:500}
#tBtns button{padding:9px 14px;font-size:15px}
#hand .card.picked{transform:translateY(-18px);box-shadow:0 0 0 3px var(--gold),0 2px 6px rgba(0,0,0,.35)}
#hand .card.marry::before{content:"💍";position:absolute;right:-4px;top:-10px;font-size:14px}

/* reactions */
#reactBar{display:flex;justify-content:center;gap:6px;padding:4px 10px 6px;flex-wrap:wrap}
#reactBar button{border:0;background:rgba(255,255,255,.14);border-radius:12px;font-size:22px;padding:4px 9px;cursor:pointer}
#reacts{position:fixed;left:0;right:0;top:70px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:15}
.rx{background:rgba(0,0,0,.7);border-radius:16px;padding:5px 12px;font-size:15px;animation:rx 2.6s ease-out forwards}
.rx b{font-size:22px;vertical-align:middle;margin-left:4px}
@keyframes rx{0%{opacity:0;transform:translateY(10px) scale(.8)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}

/* toast + panel */
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.75);padding:10px 18px;border-radius:12px;font-size:17px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.panel{background:#fffdf7;color:#1b1b1b;border-radius:18px;padding:20px 18px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.panel h2{margin:0 0 6px;font-size:22px}
.panel p{margin:6px 0;font-size:14px;line-height:1.45;text-align:left}
.panel .big{font-size:44px;margin:2px 0}
.panel .btns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.panel .btns button{border:0;border-radius:12px;padding:11px 16px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;cursor:pointer;width:100%}
.panel .btns button.sec{background:#e9e5da;color:#1b1b1b}
.panel .btns button:disabled{opacity:.55}
.muted{color:#666;font-size:14px;text-align:center!important;white-space:pre-line}
.code{font:700 30px ui-monospace,Consolas,monospace;letter-spacing:5px;margin:6px 0;color:#1b1b1b}
.lbl{font-size:13px;color:#666;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 2px}
.chip{border:0;border-radius:10px;padding:8px 13px;background:#e9e5da;color:#1b1b1b;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.plist{list-style:none;padding:0;margin:10px 0 0;text-align:left;font-size:15px}
.plist li{padding:6px 8px;border-bottom:1px solid #eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist li.free{color:#aaa}
.plist.top{margin-top:4px}
.mecard{background:#f1ede2;border-radius:12px;padding:10px 12px;margin:6px 0 4px;text-align:left;font-size:14px;line-height:1.5}
.mecard .lvl{font-size:18px;font-weight:700}
.mecard .sub{color:#666;font-size:13px}
.mecard .badges{margin-top:2px;font-weight:600}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0;text-align:left}
.achi{background:#f1ede2;border-radius:10px;padding:6px 8px;opacity:.55;display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:center}
.achi.done{opacity:1;background:#fff3c4}
.achi .ai{font-size:20px;grid-row:span 2}
.achi b{font-size:12px}
.achi small{font-size:10.5px;color:#666;line-height:1.2}
.hubact.gift{background:linear-gradient(90deg,#c0392b,#e67e22);animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
.rules{max-height:55vh;overflow:auto;text-align:left}
#tgGate{position:fixed;inset:0;z-index:9999;overflow:auto;display:flex;align-items:safe center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,#21603e 0%,#143a27 85%);color:#fff}
#tgGate .gbox{max-width:360px;width:100%;text-align:center;background:rgba(0,0,0,.25);border-radius:18px;padding:24px 18px}
#tgGate .glogo{font-size:48px}
#tgGate h2{margin:6px 0 8px}
#tgGate p{margin:0 0 18px;color:rgba(255,255,255,.8);line-height:1.45}
#tgGate .gbtn{display:block;margin:10px 0;padding:14px;border-radius:12px;background:#2f6fd6;color:#fff;text-decoration:none;font-weight:700}
#tgGate .gbtn.alt{background:rgba(255,255,255,.14)}
#tgGate .gbonus{list-style:none;margin:0 0 16px;padding:12px 14px;text-align:left;background:rgba(255,255,255,.08);border-radius:12px;font-size:15px;line-height:1.4}
#tgGate .gbonus li{margin:5px 0}
#tgGate .gbonus b{color:#f5c542}
#tgGate .glink{display:inline-block;margin-top:12px;color:rgba(255,255,255,.75);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="backBtn" hidden aria-label="Назад">←</button>
    <h1 id="title">Ігри <span>♦</span></h1>
    <span class="stat" id="stats"></span>
    <button class="hbtn" id="reactBtn" hidden aria-label="Реакції">😊</button>
    <button class="hbtn" id="soundBtn" hidden aria-label="Звук">🔊</button>
    <button class="hbtn" id="rulesBtn" hidden aria-label="Правила">?</button>
  </header>
  <div id="reactBar" hidden></div>
  <section id="hub"></section>
  <section id="game" hidden></section>
</div>
<div id="toast"></div>
<div id="reacts"></div>
<div class="overlay" id="ov" hidden><div class="panel" id="ovPanel"></div></div>
