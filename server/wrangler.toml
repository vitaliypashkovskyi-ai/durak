name = "durak"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# 1 = players outside Telegram (plain browser) may join as guests
ALLOW_GUEST = "1"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

# Sunday 17:00 UTC (19:00 Kyiv in winter): weekly tournament results; daily 14:00 and 15:30 UTC: reminders
[triggers]
crons = ["0 17 * * SUN", "0 14 * * *", "30 15 * * *"]

# secrets (npx wrangler secret put …): BOT_TOKEN_2 = @IgryUA_bot token, WEBHOOK_SECRET = Telegram webhook secret
